AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: API Gateway + WAF per-IP throttle + Lambda Authorizer (App Attest) + DynamoDB nonces

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        APP_INSTALLS_TABLE: !Ref AppInstallsTable
        NONCES_TABLE: !Ref NoncesTable
        OPENAI_API_KEY: "{{resolve:secretsmanager:steadystreak/openai:SecretString}}"

  Api:
    EndpointConfiguration: REGIONAL
    TracingEnabled: true
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'*'"
      AllowOrigin: "'*'"

Parameters:
  WafPerIpLimit:
    Type: Number
    Default: '1000'  # Must be string for CloudFormation Number type
    Description: Requests per 5-min window per IP (global rule)
  StageName:
    Type: String
    Default: prod

Resources:
  ###### DynamoDB tables ######
  AppInstallsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: keyId, AttributeType: S }
      KeySchema:
        - { AttributeName: keyId, KeyType: HASH }
      SSESpecification: { SSEEnabled: true }
      TableName: !Sub "${AWS::StackName}-AppInstalls"

  NoncesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: nonce, AttributeType: S }
      KeySchema:
        - { AttributeName: nonce, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification: { SSEEnabled: true }
      TableName: !Sub "${AWS::StackName}-Nonces"

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SteadyStreakUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ###### Lambdas (project root CodeUri) ######
  NonceFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/nonce/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NoncesTable

  RegisterFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/register/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppInstallsTable
      Environment:
        Variables:
          TEAM_ID: "RR25B7NB9X"
          BUNDLE_ID: "com.ridleytech.SteadyStreak"
          ALLOW_DEV: "true" # set false in prod

  AuthorizerFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/authorizer/index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppInstallsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NoncesTable
      Environment:
        Variables:
          TEAM_ID: "RR25B7NB9X"
          BUNDLE_ID: "com.ridleytech.SteadyStreak"
          ALLOW_DEV: "true" # set false in prod

  UsersFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: users.signup
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_USERS: !Ref UsersTable
          EMAIL_INDEX: EmailIndex
          JWT_SECRET: YOUR_LONG_RANDOM_SECRET
          REQUIRE_NONCE: "false"
          NONCE_TABLE: AttestNonces
          CORS_ORIGIN: "*"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Signup:
          Type: Api
          Properties:
            Path: /users/signup
            Method: POST
        Login:
          Type: Api
          Properties:
            Path: /users/login
            Method: POST
        Google:
          Type: Api
          Properties:
            Path: /users/google
            Method: POST

  SyncFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: sync.handler
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_USERS: !Ref UsersTable
          JWT_SECRET: YOUR_LONG_RANDOM_SECRET
          REQUIRE_NONCE: "false"
          NONCE_TABLE: AttestNonces
          CORS_ORIGIN: "*"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Sync:
          Type: Api
          Properties:
            Path: /sync
            Method: POST

  ProtectedFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/protected/index.handler
      Events:
        ProtectedGet:
          Type: Api
          Properties:
            Path: /protected
            Method: get
        ProtectedPost:
          Type: Api
          Properties:
            Path: /protected
            Method: post
        ProtectedPlan:
          Type: Api
          Properties:
            Path: /protected/plan
            Method: post

  ###### REST API (OpenAPI + REQUEST Lambda Authorizer) ######
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref StageName
      DefinitionBody:
        openapi: 3.0.1
        info: { title: "SteadyStreak API", version: "1.0" }
        paths:
          # User Authentication
          /users/signup:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UsersFn.Arn}/invocations"
              responses: {}
          /users/login:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UsersFn.Arn}/invocations"
              responses: {}
          /users/google:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UsersFn.Arn}/invocations"
              responses: {}
          
          # Sync Route
          /sync:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyncFn.Arn}/invocations"
              responses: {}
          
          # Protected Routes
          /protected:
            get:
              x-amazon-apigateway-integration:
                httpMethod: GET
                type: aws_proxy
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProtectedFn.Arn}/invocations"
              responses: {}
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProtectedFn.Arn}/invocations"
              responses: {}
          
          # Macro/Plan Route
          /protected/plan:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProtectedFn.Arn}/invocations"
              responses: {}
          
          # Existing Nonce Route
          /nonce:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${NonceFn.Arn}/invocations
          /register:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterFn.Arn}/invocations
          # Protected route is already defined in the openapi paths section above
        components:
          securitySchemes:
            AppAttestAuthorizer:
              type: apiKey
              name: X-AppAttest-Assertion
              in: header
              x-amazon-apigateway-authorizer:
                type: request
                authorizerUri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFn.Arn}/invocations
                identitySource: "method.request.header.X-AppAttest-KeyId, method.request.header.X-AppAttest-Assertion, method.request.header.X-Req-Nonce, method.request.header.X-Req-Timestamp"
                authorizerResultTtlInSeconds: 0

  ###### Lambda invoke permissions ######
  PermNonceInvokeByApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NonceFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/nonce"

  PermRegisterInvokeByApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RegisterFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/register"

  PermProtectedInvokeByApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtectedFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/protected"

  PermAuthorizerInvokeByApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/authorizers/*"

  # Permissions for Users function (handles /users/* routes)
  PermUsersInvokeByApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UsersFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/users/*"

  # Permissions for Sync function (handles /sync route)
  PermSyncInvokeByApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SyncFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/sync"

  # Permissions for Protected function (handles /protected/plan route)
  PermProtectedPlanInvokeByApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProtectedFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/protected/plan"

  ###### WAFv2 (Regional) + association to API stage ######
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-waf"
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: waf-api
        SampledRequestsEnabled: true
      Rules:
        - Name: PerIpGlobalLimit
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: !Ref WafPerIpLimit  # This is a string that will be converted to a number by CloudFormation
              AggregateKeyType: IP
          Action: { Block: {} }
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: per-ip-global
            SampledRequestsEnabled: true
        - Name: PerIpProtectedTight
          Priority: 2
          Statement:
            RateBasedStatement:
              Limit: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: EXACTLY
                        SearchString: "/protected"
                        TextTransformations: [{ Priority: 0, Type: NONE }]
                    - ByteMatchStatement:
                        FieldToMatch: { Method: {} }
                        PositionalConstraint: EXACTLY
                        SearchString: "POST"
                        TextTransformations: [{ Priority: 0, Type: NONE }]
          Action: { Block: {} }
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: per-ip-protected
            SampledRequestsEnabled: true

  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${RestApi}/stages/${StageName}"
      WebACLArn: !GetAtt WebACL.Arn

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
    Description: Base URL of the API
